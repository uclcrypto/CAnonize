[package]
name = "anonymous_survey"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ark-ec="0.5.0"
ark-ff="0.5.0"
ark-std="0.5.0"
ark-bls12-381="0.5.0"
ark-serialize = { version = "0.5", features = ["derive"] }
rand = "0.9.2"
groth-sahai = { git = "https://github.com/jdwhite48/groth-sahai-rs", branch = "main" }
zeroize = "1.8.2" 
sha2 = "0.10.9"
hex="0.4.3"
generic-array = "~0.14.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false

[profile.dev]
opt-level = 1
